name: Supabase Auto Backup

# P1 自动备份：每周日把 health_records + body_events 全量 dump 成一个 JSON，
# 存到 Supabase 的 backups 表（一行 = 一份完整备份），保留最近 8 周（56 天自动清理）。
# 恢复方式：从 backups 表下载对应 payload.json，即可重新导入。
# 前置条件：需在 Supabase SQL Editor 执行一次建表 SQL（见交付说明）。

on:
  schedule:
    - cron: '3 2 * * 0'   # 每周日 UTC 02:03 = 北京 10:03
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dump tables -> backups (keep 8 weeks)
        run: |
          BASE="https://dlnqhosjodkgyuojbyxo.supabase.co/rest/v1"
          KEY="sb_publishable_WJ4NSoqO2LTfq6WUo728DQ_0eMnvABo"
          AUTH=(-H "apikey: $KEY" -H "Authorization: Bearer $KEY" --max-time 25 --retry 3 --retry-delay 5)
          set -e

          curl -sS "${AUTH[@]}" "$BASE/health_records?select=*&limit=5000" -o hr.json
          curl -sS "${AUTH[@]}" "$BASE/body_events?select=*&limit=5000" -o be.json

          node -e '
            const fs = require("fs");
            const hr = JSON.parse(fs.readFileSync("hr.json", "utf8"));
            const be = JSON.parse(fs.readFileSync("be.json", "utf8"));
            if (!Array.isArray(hr) || !Array.isArray(be)) throw new Error("dump 失败: " + JSON.stringify({hr, be}).slice(0, 300));
            const payload = {
              exported_at: new Date().toISOString(),
              counts: { health_records: hr.length, body_events: be.length },
              health_records: hr,
              body_events: be,
            };
            fs.writeFileSync("payload.json", JSON.stringify({ payload }));
            console.log("dump ok:", hr.length, "条健康记录 +", be.length, "条身体事件");
          '

          CODE=$(curl -sS -X POST "${AUTH[@]}" -H "Content-Type: application/json" \
            -d @payload.json "$BASE/backups" -o resp.json -w "%{http_code}")
          echo "insert HTTP $CODE"
          # 201 = 插入成功（响应体可能为空，不以 body 为准）
          if [ "$CODE" != "201" ]; then echo "插入 backups 失败:"; cat resp.json; exit 1; fi

          CUT=$(node -e 'console.log(new Date(Date.now() - 56 * 86400000).toISOString())')
          curl -sS -X DELETE "${AUTH[@]}" "$BASE/backups?created_at=lt.$CUT" -o /dev/null -w "cleanup HTTP %{http_code}\n"

          # —— 第二落点（v100）：同时存一份到 GitHub 私有仓库，防止 Supabase 单点故障 ——
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("payload.json", "utf8")).payload;
            fs.writeFileSync("backup-file.json", JSON.stringify(p, null, 1));
          '
          GH_TOKEN="${{ secrets.BACKUP_REPO_TOKEN }}"
          BDATE=$(date -u +%Y-%m-%d)
          BPATH="backup-$BDATE.json"
          B64=$(base64 -w0 backup-file.json)
          SHA=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "User-Agent: family-health-backup" \
            "https://api.github.com/repos/peiwenxiao77/family-health-backups/contents/$BPATH" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).sha||"")}catch(e){console.log("")}})')
          BODY=$(node -e '
            const [, bdate, b64, sha] = process.argv;
            console.log(JSON.stringify({
              message: "weekly backup " + bdate,
              content: b64,
              branch: "main",
              ...(sha ? { sha } : {})
            }));
          ' "$BDATE" "$B64" "$SHA")
          UCODE=$(curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "User-Agent: family-health-backup" \
            -H "Content-Type: application/json" -d "$BODY" \
            "https://api.github.com/repos/peiwenxiao77/family-health-backups/contents/$BPATH" -o ghresp.json -w "%{http_code}")
          echo "github upload HTTP $UCODE"
          if [ "$UCODE" != "200" ] && [ "$UCODE" != "201" ]; then echo "上传私有仓库失败:"; cat ghresp.json; exit 1; fi
          echo "✓ 备份完成：Supabase backups 表（8 周滚动）+ 私有仓库 family-health-backups/$BPATH（永久保留）"
